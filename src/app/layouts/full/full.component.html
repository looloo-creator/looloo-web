<mat-sidenav-container class="mainWrapper blue_theme  light-theme" autosize autoFocus dir="ltr">
  <!-- ============================================================== -->
  <!-- Vertical Sidebar -->
  <!-- ============================================================== -->

  <mat-sidenav #leftsidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()" class="sidebarNav">
    <app-sidebar></app-sidebar>
  </mat-sidenav>
  <!-- ============================================================== -->
  <!-- Main Content -->
  <!-- ============================================================== -->
  <mat-sidenav-content class="contentWrapper">
    <!-- ============================================================== -->
    <!-- VerticalHeader -->
    <!-- ============================================================== -->

    <app-header [showToggle]="!isOver" (toggleCollapsed)="toggleCollapsed()"
    (toggleMobileNav)="sidenav.toggle()"></app-header>

    <main class="pageWrapper">

      <!-- ============================================================== -->
      <!-- Outlet -->
      <!-- ============================================================== -->
      <router-outlet></router-outlet>
      @if (loader) {
        <div class="loader">
          <mat-spinner></mat-spinner>
          <div class="spinner_overlay"></div>
        </div>
      }
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>

<div class="assistant-launcher-layer">
  @if (assistantOpen) {
    <section class="assistant-panel" aria-label="Looloo AI assistant">
      <looloo-assistant-chat
        title="Looloo Assistant"
        subtitle="Your travel sidekick"
        [messages]="assistantMessages"
        [conversationHistory]="assistantHistory"
        [activeConversationId]="activeConversationId"
        [disabled]="assistantLoading"
        (sendMessage)="onAssistantMessage($event)"
        (conversationSelected)="selectAssistantConversation($event)"
        (newConversation)="startAssistantConversation()">
      </looloo-assistant-chat>
    </section>
  }

  <button
    class="assistant-launcher"
    type="button"
    [class.is-open]="assistantOpen"
    [attr.aria-expanded]="assistantOpen"
    [attr.aria-label]="assistantOpen ? 'Close Looloo Assistant' : 'Open Looloo Assistant'"
    (click)="toggleAssistant()">
    @if (assistantOpen) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 14.6 9.4 21.2 12l-6.6 2.6L12 21.2l-2.6-6.6L2.8 12l6.6-2.6L12 2.8Z" /></svg>
      <span>Ask Looloo</span>
    }
  </button>
</div>
